name: Public Image Features
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No path filter: any change to Cargo.toml, docker/ or a publishing workflow must be checked.
on: [ push, pull_request ]

defaults:
  run:
    shell: bash

jobs:
  check:
    name: No hosted or kye2e in public images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public image features
        run: scripts/check-public-image-features.sh

      - name: Self-test the check
        run: scripts/test-check-public-image-features.sh
